; The DSO-152 serial analyser, continued from D:\DSO152\dso152-oct.
;
; Board and upload path are dso152-apong's. Two things do not carry over
; from the Arduino sketch:
;
;   build_opt.h, which is an Arduino IDE mechanism, raised the serial
;   receive buffer to 512. Here that is a build flag.
;
;   The sketch was dso152-oct.ino; as a .cpp it needs Arduino.h, which the
;   IDE supplies on its own. That one line is the only edit to it.
;
; build_src_flags forces Arduino.h into every file under src/, which is
; what keeps those files byte-identical with D:\DSO152\dso152-oct.
; jos88.h opens with a uint8_t array and includes nothing, and
; DisplayLarge.h pulls it in before anything that would define that type,
; so on its own it will not compile. The alternative is a line of
; #include <stdint.h> in jos88.h, which would be the proper fix but makes
; the two trees differ.

[platformio]
default_envs = dso152

[env:dso152]
platform = ststm32@19.0.0
board = genericSTM32F103R8
board_build.mcu = stm32f103r8t6
framework = arduino

debug_tool = stlink
upload_protocol = stlink
upload_resetmethod = none separate

build_flags = -DSERIAL_RX_BUFFER_SIZE=512
build_src_flags = -include Arduino.h

lib_deps = adafruit/Adafruit GFX Library@1.12.6

; The program ends at 0x0800FC00, where the stock calibration page starts; the
; settings are the last 16 bytes of that page (src/Config.cpp).
board_upload.maximum_size = 64512

; The same firmware with a line that is not there: a synthetic 9600 baud
; stream is fed to the decoder instead of the ADC, so the screen can be seen
; and the decoding exercised with nothing on the probe.
[env:dso152-demo]
extends = env:dso152
build_flags = ${env:dso152.build_flags} -DDEMO_SIGNAL

; Linked above the FNIRSI bootloader, at the address of the original
; application (0x08003C00), and stopping short of the calibration pages at
; 0x0800FC00. This is the image that could go through the USB-drive update,
; if the bootloader accepts it; an SWD upload of it touches only its own pages.
[env:dso152-bl]
extends = env:dso152
board_build.flash_offset = 0x3C00
board_upload.offset_address = 0x08003C00
; As above: to 0x0800FC00. The linker takes the offset off this itself, which
; leaves 49152 bytes for the program; the percentage PlatformIO prints is of
; the whole 64512 and so reads low.
board_upload.maximum_size = 64512

; dso152-bl with the synthetic signal, for a unit with no analogue input.
[env:dso152-bl-demo]
extends = env:dso152-bl
build_flags = ${env:dso152.build_flags} -DDEMO_SIGNAL

; dso152-bl that also exports a known buffer into memory at start, so that the
; export formats can be checked over SWD with tools/selftest_check.py.
[env:dso152-bl-selftest]
extends = env:dso152-bl
build_flags = ${env:dso152.build_flags} -DEXPORT_SELFTEST

; dso152-bl-demo that hands every rectangle it draws to a laptop over SWD, so
; that tools/screenshots.py can rebuild the screen and save pictures of it.
; It waits for the laptop when its buffer is full, so it is of no use alone.
[env:dso152-bl-shot]
extends = env:dso152-bl
build_flags = ${env:dso152.build_flags} -DDEMO_SIGNAL -DSCREEN_TAP
